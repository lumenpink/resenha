name: CI, Build & Sovereign CD

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-and-test:
    name: "Rust — Checks & Unit Tests"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Rust Toolchain"
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi

      - name: "Cargo Check"
        run: cargo check

      - name: "Run Unit & Integration Tests"
        run: cargo test

      - name: "Audit Sovereign CD Workflow"
        run: bash tests/audit_cd_workflow.sh

      - name: "CCCP Quality Audit"
        run: |
          if command -v cccp >/dev/null 2>&1; then
            cccp check --strict
          fi

  build-and-deploy-docker:
    name: "Container — Build & Sovereign CD (obizero)"
    runs-on: ubuntu-latest
    needs: [check-and-test]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Build local Docker Image"
        run: |
          OLD_IMAGE_ID=$(docker inspect --format='{{.Id}}' gambi.2lp.in/lumen/resenha:latest 2>/dev/null || true)
          echo "OLD_IMAGE_ID=$OLD_IMAGE_ID" >> $GITHUB_ENV
          docker build -t gambi.2lp.in/lumen/resenha:latest -f ./Dockerfile .

      - name: "Push Image to Sovereign Registry (gambi.2lp.in)"
        if: env.GAMBI_TOKEN != ''
        env:
          GAMBI_TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN || secrets.GIT_2LP_TOKEN }}
        run: |
          echo "$GAMBI_TOKEN" | docker login -u lumen --password-stdin gambi.2lp.in
          docker push gambi.2lp.in/lumen/resenha:latest

      - name: "Sovereign CD on obizero via SSH"
        env:
          OBIZERO_SSH_HOST: ${{ secrets.OBIZERO_SSH_HOST }}
          OBIZERO_SSH_USER: ${{ secrets.OBIZERO_SSH_USER }}
          OBIZERO_SSH_KEY: ${{ secrets.OBIZERO_SSH_KEY }}
        run: |
          SSH_HOST="${OBIZERO_SSH_HOST:-172.17.0.1}"
          SSH_USER="${OBIZERO_SSH_USER:-lumen}"
          echo "-> Iniciando deploy soberano no nó obizero ($SSH_HOST)..."

          if [ -f ~/.ssh/id_obitwo ]; then
            SSH_OPTS="-i ~/.ssh/id_obitwo -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          elif [ -f ~/.ssh/id_ed25519 ]; then
            SSH_OPTS="-i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          elif [ -n "$OBIZERO_SSH_KEY" ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            echo "$OBIZERO_SSH_KEY" > /tmp/id_ci_obizero
            chmod 600 /tmp/id_ci_obizero
            SSH_OPTS="-i /tmp/id_ci_obizero -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          else
            SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          fi

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "
            set -eo pipefail
            cd ~/stacks/resenha
            OLD_IMAGE_ID=\$(docker inspect --format='{{.Id}}' gambi.2lp.in/lumen/resenha:latest 2>/dev/null || true)
            echo \"OLD_IMAGE_ID=\$OLD_IMAGE_ID\"

            echo '-> Aplicando atualizacao no container resenha...'
            docker compose -f compose.yml up -d --no-build resenha

            echo '-> Sondando estabilidade do container resenha (polling 15s)...'
            SUCCESS=0
            for i in \$(seq 1 15); do
              STATUS=\$(docker inspect --format='{{.State.Status}}' resenha 2>/dev/null || echo 'unknown')
              if [ \"\$STATUS\" = 'running' ]; then
                echo \"  [PASS] Container resenha saudavel e ativo (tentativa \$i/15).\"
                SUCCESS=1
                break
              fi
              sleep 1
            done

            if [ \$SUCCESS -ne 1 ]; then
              echo '✘ [FALHA] Container nao estabilizou no prazo limite! Acionando Rollback...'
              if [ -n \"\$OLD_IMAGE_ID\" ]; then
                docker tag \"\$OLD_IMAGE_ID\" gambi.2lp.in/lumen/resenha:latest
                docker compose -f compose.yml up -d --no-build resenha
                echo \"✔ Rollback concluido para imagem anterior \$OLD_IMAGE_ID.\"
              fi
              exit 1
            fi

            echo '-> Limpando camadas orfas...'
            docker image prune -f
          "
