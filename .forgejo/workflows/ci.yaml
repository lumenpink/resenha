name: CI, Build & Autonomous CD

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-and-test:
    name: "Rust — Checks & Unit Tests"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Rust Toolchain"
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi

      - name: "Rustfmt Check"
        run: cargo fmt --check

      - name: "Cargo Check"
        run: cargo check

      - name: "Run Unit & Integration Tests"
        run: cargo test

      - name: "Audit Autonomous CD Workflow"
        run: bash tests/audit_cd_workflow.sh

      - name: "CCCP Quality Audit"
        run: |
          if command -v cccp >/dev/null 2>&1; then
            cccp hook -i || true
            cccp check --strict
          fi

  build-and-deploy-docker:
    name: "Container — Build & Autonomous CD (obizero)"
    runs-on: ubuntu-latest
    needs: [check-and-test]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Build local Docker Image"
        run: |
          OLD_IMAGE_ID=$(docker inspect --format='{{.Id}}' gambi.2lp.in/lumen/resenha:latest 2>/dev/null || true)
          echo "OLD_IMAGE_ID=$OLD_IMAGE_ID" >> $GITHUB_ENV
          docker build -t gambi.2lp.in/lumen/resenha:latest -f ./Dockerfile .

      - name: "Push Image to Gambi Registry (gambi.2lp.in)"
        if: env.GAMBI_TOKEN != ''
        env:
          GAMBI_TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN || secrets.GIT_2LP_TOKEN }}
        run: |
          echo "$GAMBI_TOKEN" | docker login -u lumen --password-stdin gambi.2lp.in
          docker push gambi.2lp.in/lumen/resenha:latest

