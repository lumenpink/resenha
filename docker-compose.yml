services:
  resenha:
    build:
      context: .
      dockerfile: Dockerfile
    image: gambi.2lp.in/lumen/resenha:latest
    container_name: resenha
    restart: unless-stopped
    ports:
      - "${PORT:-3030}:3030"
    environment:
      - RESENHA_PORT=3030
      - RESENHA_BIND=0.0.0.0
      - RUST_LOG=info
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3030/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
